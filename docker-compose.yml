# Local production-like stack (API + website + MySQL).
# Usage (from repo root):
#   docker compose up --build
#
# API:     http://localhost:8000/health
# Website: http://localhost:8080

services:
  mysql:
    build:
      context: .
      dockerfile: deployment/mysql/Dockerfile
    environment:
      MYSQL_DATABASE: election_db
      MYSQL_USER: election
      MYSQL_PASSWORD: election
      MYSQL_ROOT_PASSWORD: rootchange
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uelection", "-pelection"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_TO_FILE: "false"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: election_db
      DATABASE_USER: election
      DATABASE_PASSWORD: election
      JWT_SECRET: compose-dev-jwt-secret-at-least-32-chars-long
      CORS_ORIGINS: http://localhost:8080
      UPLOAD_FOLDER: /data/uploads
      REPORT_FOLDER: /data/reports
      BACKUP_FOLDER: /data/backups
      CONFIG_PACKAGE_FOLDER: /data/config_packages
      LOG_FOLDER: /data/logs
      PORT: "8000"
      RUN_MIGRATIONS: "true"
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_TO_FILE: "false"
      BACKEND_URL: http://api:8000
      WEBSITE_HOST: 0.0.0.0
      WEBSITE_PORT: "8080"
      PORT: "8080"
      WEBSITE_RELOAD: "false"
      WEBSITE_STORAGE_SECRET: compose-dev-website-secret-at-least-32-chars
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
  api_data:
